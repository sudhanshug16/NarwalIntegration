validate_parameterized_clean:
  name: Validate parameterized room cleaning
  description: Send an unverified app-derived clean/start_clean payload to an explicitly opted-in AX15. Supervise the robot and use Stop if its physical behavior is unexpected.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: Narwal room IDs to clean, in order, or "all" for all current map rooms.
      required: true
      selector:
        object:
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_then_mop
            - vacuum_and_mop
    suction:
      name: Suction
      default: standard
      selector:
        select:
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
            - ultra_powerful
    water:
      name: Water
      default: normal
      selector:
        select:
          options:
            - dry
            - normal
            - wet
    mop_strength:
      name: Mop strength
      default: normal
      selector:
        select:
          options:
            - normal
            - high
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    route:
      name: Route
      selector:
        select:
          options:
            - standard
            - meticulous
    confirm_unverified:
      name: Confirm supervised test
      description: Required on every call. Confirms that this is a supervised validation run, not a supported automation.
      required: true
      selector:
        boolean:
